# Deploys the static app to GitHub Pages. Only the files the app needs are published:
# tools/, tests/, samples/, docs/ and the rest of the repository are left out.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest app vendor _site/
          # New cache name for every deploy, so installed copies update.
          sed -i "s/^const VERSION = 'dev';/const VERSION = '${GITHUB_SHA::12}';/" _site/sw.js
          grep -q "^const VERSION = '${GITHUB_SHA::12}';" _site/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
